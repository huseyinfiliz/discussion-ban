version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-compatible:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    groups:
      yarn-compatible:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
