name: Discussion Ban PHP

on: [workflow_dispatch, push, pull_request]

permissions:
  contents: read

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_backend.yml@83ea68baa2a5ba6abafbdcb8628be69bacabd19e # 2.x

  verify:
    name: ${{ needs.run.result == 'skipped' && 'PHP checks skipped' || 'PHP checks' }}
    if: always() && needs.run.result != 'skipped'
    needs: run
    runs-on: ubuntu-latest
    steps:
      - name: Require successful backend checks
        env:
          RESULT: ${{ needs.run.result }}
        run: test "$RESULT" = success
